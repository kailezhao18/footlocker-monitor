<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot Locker Monitor V5</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial;color:#172033}header{background:#111827;color:#fff;padding:20px 25px}header h2{margin:0}main{max-width:1400px;margin:auto;padding:22px}.bar{display:flex;gap:10px;background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{border:0;background:#2563eb;color:#fff;padding:11px 16px;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.card{background:white;border:2px solid #d1d5db;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.card.changed{border-color:#22c55e}.img{height:200px;background:#f3f4f6;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:contain}.price{font-size:22px;font-weight:800;margin-top:10px}.name{font-weight:800;margin-top:5px;font-size:18px}.sku{font-family:monospace;color:#64748b;margin-top:5px}.section{border-top:1px solid #eee;margin-top:12px;padding-top:10px}.sectionTitle{font-size:12px;font-weight:800;letter-spacing:.08em;color:#475569;margin-bottom:7px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;margin:0 6px 6px 0;font-weight:800;font-size:13px}.available{background:#dcfce7;color:#166534}.oos{background:#fee2e2;color:#991b1b;text-decoration:line-through}.unknown{background:#e2e8f0;color:#475569}.event{font-size:13px;padding:6px 8px;border-radius:8px;margin:5px 0}.restock{background:#dcfce7;color:#166534}.soldout{background:#fee2e2;color:#991b1b}.meta{font-size:12px;color:#64748b;margin-top:8px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;padding:8px}.del{background:#fee2e2;color:#b91c1c}#statusMsg{font-size:14px;margin:8px 2px 16px;color:#64748b;min-height:20px}.error{color:#b91c1c!important}.ok{color:#15803d!important}.empty{background:#fff;border-radius:12px;padding:22px;color:#64748b}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#f1f5f9;color:#475569;margin-left:7px}</style></head><body><header><h2>👟 Foot Locker Monitor <span class="badge">V5</span></h2></header><main><div class="bar"><input id="skuInput" placeholder="输入 Foot Locker SKU，例如 35381007"><button id="addBtn" type="button">Add SKU</button></div><div id="statusMsg">Ready</div><div class="grid" id="productGrid"></div></main><script>
const skuInput=document.getElementById('skuInput');const addBtn=document.getElementById('addBtn');const statusMsg=document.getElementById('statusMsg');const productGrid=document.getElementById('productGrid');let ps=[];try{ps=JSON.parse(localStorage.getItem('flv5')||localStorage.getItem('flv4')||'[]')}catch(e){ps=[]}const save=()=>localStorage.setItem('flv5',JSON.stringify(ps));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setStatus(msg,type=''){statusMsg.textContent=msg;statusMsg.className=type}function fmtTime(t){if(!t)return'Never';try{return new Date(t).toLocaleString()}catch(e){return t}}function pills(arr,cls){return(arr||[]).length?(arr||[]).map(s=>`<span class="pill ${cls}">${esc(s)}</span>`).join(''):'<span class="meta">None detected</span>'}function renderEvents(p){let ev=p.events||[];if(!ev.length)return'<div class="meta">No stock changes recorded yet.</div>';return ev.slice(0,6).map(e=>`<div class="event ${e.type==='restock'?'restock':'soldout'}">${e.type==='restock'?'🟢 RESTOCKED':'🔴 SOLD OUT'} — Size ${esc(e.size)} <span class="meta">${esc(e.time)}</span></div>`).join('')}function render(){if(!ps.length){productGrid.innerHTML='<div class="empty">还没有监控商品。输入 SKU 后点击 Add SKU。</div>';return}productGrid.innerHTML=ps.map((p,i)=>`<div class="card ${p.changed?'changed':''}"><div class="img"><img src="${esc(p.image||'')}" onerror="this.style.display='none'"></div><div class="price">${p.price?'$'+esc(p.price):'Price N/A'}</div><div class="name">${esc(p.name||'Foot Locker Product')}</div><div class="sku">SKU: ${esc(p.sku)}</div><div class="section"><div class="sectionTitle">AVAILABLE</div>${pills(p.available_sizes||p.sizes,'available')}</div><div class="section"><div class="sectionTitle">OUT OF STOCK</div>${pills(p.out_of_stock_sizes,'oos')}</div>${(p.unknown_sizes||[]).length?`<div class="section"><div class="sectionTitle">UNKNOWN STATE</div>${pills(p.unknown_sizes,'unknown')}</div>`:''}<div class="section"><div class="sectionTitle">RECENT CHANGES</div>${renderEvents(p)}</div><div class="meta">Last checked: ${esc(fmtTime(p.last_checked))}</div><div class="actions"><button type="button" onclick="refreshProduct(${i})">Refresh</button><button type="button" onclick="window.open('${esc(p.url||'')}','_blank')">Foot Locker</button><button type="button" class="del" onclick="deleteProduct(${i})">Delete</button></div></div>`).join('')}async function getProduct(s){const r=await fetch('/api/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:s})});let d;try{d=await r.json()}catch(e){throw new Error('服务器返回无法读取的结果 (HTTP '+r.status+')')}if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d.product}function diffEvents(oldP,newP){const oldAvail=new Set(oldP.available_sizes||oldP.sizes||[]);const newAvail=new Set(newP.available_sizes||[]);const now=new Date().toLocaleString();let events=[...(oldP.events||[])];for(const s of newAvail)if(!oldAvail.has(s))events.unshift({type:'restock',size:s,time:now});for(const s of oldAvail)if(!newAvail.has(s))events.unshift({type:'soldout',size:s,time:now});return events.slice(0,20)}async function addProduct(){const s=skuInput.value.trim();if(!s){setStatus('请输入 SKU。','error');return}addBtn.disabled=true;setStatus('正在读取 '+s+'...');try{const p=await getProduct(s);p.changed=false;p.events=[];const i=ps.findIndex(x=>String(x.sku).toUpperCase()===s.toUpperCase());if(i>=0){p.events=ps[i].events||[];ps[i]=p}else ps.unshift(p);save();render();skuInput.value='';setStatus('已添加 '+s+'。','ok')}catch(e){setStatus('读取失败：'+e.message,'error')}finally{addBtn.disabled=false}}async function refreshProduct(i){const old=ps[i];setStatus('正在刷新 '+old.sku+'...');try{const p=await getProduct(old.sku);p.events=diffEvents(old,p);const oldA=JSON.stringify(old.available_sizes||old.sizes||[]),newA=JSON.stringify(p.available_sizes||[]),oldO=JSON.stringify(old.out_of_stock_sizes||[]),newO=JSON.stringify(p.out_of_stock_sizes||[]);p.changed=String(p.price)!==String(old.price)||oldA!==newA||oldO!==newO;ps[i]=p;save();render();setStatus(p.changed?'检测到价格或库存变化。':'暂无变化。',p.changed?'ok':'')}catch(e){setStatus('刷新失败：'+e.message,'error')}}function deleteProduct(i){ps.splice(i,1);save();render();setStatus('已删除。')}addBtn.addEventListener('click',addProduct);skuInput.addEventListener('keydown',e=>{if(e.key==='Enter')addProduct()});render();
</script></body></html>
