<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot Locker Monitor</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial;color:#172033}header{background:#111827;color:#fff;padding:20px 25px}main{max-width:1300px;margin:auto;padding:22px}.bar{display:flex;gap:10px;background:#fff;padding:15px;border-radius:12px;margin-bottom:12px}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{border:0;background:#2563eb;color:#fff;padding:11px 16px;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:white;border:2px solid #d1d5db;border-radius:12px;padding:10px}.card.changed{border-color:#22c55e}.img{height:180px;background:#f3f4f6;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:contain}.price{font-size:21px;font-weight:800;margin-top:9px}.name{font-weight:700;margin-top:5px}.sku{font-family:monospace;color:#64748b;margin-top:5px}.sizes{border-top:1px solid #eee;margin-top:9px;padding-top:8px;line-height:1.9}.sizes span{color:#15803d;font-weight:bold;margin-right:8px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:8px}.del{background:#fee2e2;color:#b91c1c}#statusMsg{font-size:14px;margin:8px 2px 16px;color:#64748b;min-height:20px}.error{color:#b91c1c!important}.ok{color:#15803d!important}</style></head><body><header><h2>👟 Foot Locker Monitor</h2></header><main><div class="bar"><input id="skuInput" placeholder="只输入 Foot Locker SKU，例如 F7792102"><button id="addBtn" type="button">Add SKU</button></div><div id="statusMsg">Ready</div><div class="grid" id="productGrid"></div></main><script>
const skuInput=document.getElementById('skuInput');
const addBtn=document.getElementById('addBtn');
const statusMsg=document.getElementById('statusMsg');
const productGrid=document.getElementById('productGrid');
let ps=[];try{ps=JSON.parse(localStorage.getItem('flv4')||'[]')}catch(e){ps=[]}
const save=()=>localStorage.setItem('flv4',JSON.stringify(ps));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(msg,type=''){statusMsg.textContent=msg;statusMsg.className=type}
function render(){productGrid.innerHTML=ps.map((p,i)=>`<div class="card ${p.changed?'changed':''}"><div class="img"><img src="${esc(p.image||'')}" onerror="this.style.display='none'"></div><div class="price">${p.price?'$'+esc(p.price):'Price N/A'}</div><div class="name">${esc(p.name||'Foot Locker Product')}</div><div class="sku">SKU: ${esc(p.sku)}</div><div class="sizes"><b>Available Sizes</b><br>${p.sizes?.length?p.sizes.map(s=>`<span>${esc(s)}</span>`).join(''):'Not detected'}</div><div class="actions"><button type="button" onclick="refreshProduct(${i})">Refresh</button><button type="button" onclick="window.open('${esc(p.url||'')}','_blank')">Foot Locker</button><button type="button" class="del" onclick="deleteProduct(${i})">Delete</button></div></div>`).join('')||'还没有监控商品。';}
async function getProduct(s){const r=await fetch('/api/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:s})});let d;try{d=await r.json()}catch(e){throw new Error('服务器返回了无法读取的结果 (HTTP '+r.status+')')}if(!r.ok||!d.ok)throw new Error(d.error||('HTTP '+r.status));return d.product}
async function addProduct(){const s=skuInput.value.trim();if(!s){setStatus('请输入 SKU。','error');return}addBtn.disabled=true;setStatus('正在读取 '+s+'...');try{const p=await getProduct(s);p.changed=false;const i=ps.findIndex(x=>String(x.sku).toUpperCase()===s.toUpperCase());if(i>=0)ps[i]=p;else ps.unshift(p);save();render();skuInput.value='';setStatus('已添加 '+s+'。','ok')}catch(e){setStatus('读取失败：'+e.message,'error')}finally{addBtn.disabled=false}}
async function refreshProduct(i){const old=ps[i];setStatus('正在刷新 '+old.sku+'...');try{const p=await getProduct(old.sku);p.changed=String(p.price)!==String(old.price)||JSON.stringify(p.sizes||[])!==JSON.stringify(old.sizes||[]);ps[i]=p;save();render();setStatus(p.changed?'检测到价格或尺码变化。':'暂无变化。',p.changed?'ok':'')}catch(e){setStatus('刷新失败：'+e.message,'error')}}
function deleteProduct(i){ps.splice(i,1);save();render();setStatus('已删除。')}
addBtn.addEventListener('click',addProduct);skuInput.addEventListener('keydown',e=>{if(e.key==='Enter')addProduct()});render();
</script></body></html>
