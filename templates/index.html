<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foot Locker Monitor</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial;color:#172033}header{background:#111827;color:#fff;padding:20px 25px}main{max-width:1300px;margin:auto;padding:22px}.bar{display:flex;gap:10px;background:#fff;padding:15px;border-radius:12px;margin-bottom:20px}input{flex:1;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{border:0;background:#2563eb;color:#fff;padding:11px 16px;border-radius:8px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}.card{background:white;border:2px solid #d1d5db;border-radius:12px;padding:10px}.card.changed{border-color:#22c55e}.img{height:180px;background:#f3f4f6;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:contain}.price{font-size:21px;font-weight:800;margin-top:9px}.name{font-weight:700;margin-top:5px}.sku{font-family:monospace;color:#64748b;margin-top:5px}.sizes{border-top:1px solid #eee;margin-top:9px;padding-top:8px;line-height:1.9}.sizes span{color:#15803d;font-weight:bold;margin-right:8px}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:8px}.del{background:#fee2e2;color:#b91c1c}#status{font-size:13px;margin:8px 0 16px;color:#64748b}</style></head><body><header><h2>👟 Foot Locker Monitor</h2></header><main><div class="bar"><input id="sku" placeholder="只输入 Foot Locker SKU，例如 F7792102"><button onclick="add()">Add SKU</button></div><div id="status"></div><div class="grid" id="grid"></div></main><script>let ps=JSON.parse(localStorage.getItem('flv4')||'[]');const save=()=>localStorage.setItem('flv4',JSON.stringify(ps));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){grid.innerHTML=ps.map((p,i)=>`<div class="card ${p.changed?'changed':''}"><div class="img"><img src="${esc(p.image||'')}" onerror="this.style.display='none'"></div><div class="price">${p.price?'$'+esc(p.price):'Price N/A'}</div><div class="name">${esc(p.name)}</div><div class="sku">SKU: ${esc(p.sku)}</div><div class="sizes"><b>Available Sizes</b><br>${p.sizes?.length?p.sizes.map(s=>`<span>${esc(s)}</span>`).join(''):'Not detected'}</div><div class="actions"><button onclick="refresh(${i})">Refresh</button><button onclick="window.open('${esc(p.url)}','_blank')">Foot Locker</button><button class="del" onclick="del(${i})">Delete</button></div></div>`).join('')||'还没有监控商品。';}async function get(s){let r=await fetch('/api/product',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:s})});return r.json()}async function add(){let s=sku.value.trim();if(!s)return;status.textContent='正在读取 '+s+'...';let d=await get(s);if(!d.ok){status.textContent='读取失败：'+d.error;return}d.product.changed=false;let i=ps.findIndex(x=>x.sku===s);i>=0?ps[i]=d.product:ps.unshift(d.product);save();render();sku.value='';status.textContent='已添加 '+s;}async function refresh(i){let old=ps[i];status.textContent='正在刷新 '+old.sku+'...';let d=await get(old.sku);if(!d.ok){status.textContent='刷新失败：'+d.error;return}let p=d.product;p.changed=String(p.price)!==String(old.price)||JSON.stringify(p.sizes)!==JSON.stringify(old.sizes);ps[i]=p;save();render();status.textContent=p.changed?'检测到价格或尺码变化':'暂无变化';}function del(i){ps.splice(i,1);save();render()}render();</script></body></html>
